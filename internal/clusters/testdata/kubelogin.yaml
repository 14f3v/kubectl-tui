apiVersion: v1
kind: Config
clusters:
- name: dev
  cluster: {server: "https://dev.example:6443"}
users:
- name: u
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: kubelogin
      args: [get-token, --oidc-client-secret=s3cr3t, --token, abc, --other, x]
      interactiveMode: IfAvailable
contexts:
- name: dev
  context: {cluster: dev, user: u}
