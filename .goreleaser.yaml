# goreleaser configuration for kubetui.
# Build locally with: goreleaser build --snapshot --clean
# Dry-run a whole release (archives, checksums, Homebrew formula in dist/, nothing
# published, no tokens needed) with: goreleaser release --snapshot --clean
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: kubetui
    main: ./cmd/kubetui
    binary: kubetui # goreleaser appends .exe for windows -> kubetui.exe
    env:
      - CGO_ENABLED=0
    # CGO is off, so every target cross-compiles from the ubuntu release runner.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: kubetui
    formats: [tar.gz]
    # Windows gets a zip: every Windows version opens one without extra tools, and
    # the winget publisher (see the Scoop note at the end) only installs from zips.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "kubetui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - docs/*

checksum:
  name_template: "checksums.txt"

# `goreleaser release` (run by .github/workflows/release.yml on a v* tag) creates a
# GitHub Release for the repo. Tags with a pre-release suffix (e.g. v1.0.0-rc1) are
# marked as prereleases automatically.
release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish a Homebrew formula to the tap on release. The tap push uses
# HOMEBREW_TAP_TOKEN (a PAT with write access to 14f3v/homebrew-tap), supplied by
# the release workflow — the default GITHUB_TOKEN can't push to another repo.
# Both repos are public, so installing needs no token:
#   brew install 14f3v/tap/kubetui
brews:
  - repository:
      owner: 14f3v
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Name the formula after the tool/binary, not the repo — so the install command
    # is `brew install 14f3v/tap/kubetui` (default would be the repo name kubectl-tui).
    name: kubetui
    directory: Formula
    homepage: "https://github.com/14f3v/kubectl-tui"
    description: "A terminal UI for managing and monitoring Kubernetes clusters"
    license: "Apache-2.0"
    install: |
      bin.install "kubetui"
    test: |
      system "#{bin}/kubetui", "--version"

# Scoop manifest for Windows — ready to enable, but off until its bucket exists.
# To turn it on:
#   1. create the public repo 14f3v/scoop-bucket;
#   2. add a repo secret SCOOP_BUCKET_TOKEN: a PAT with write access to that repo
#      (as with the tap, the default GITHUB_TOKEN can't push to another repo);
#   3. pass it to goreleaser in release.yml next to HOMEBREW_TAP_TOKEN:
#        SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
#   4. uncomment the block below and document the install in the README:
#        scoop bucket add 14f3v https://github.com/14f3v/scoop-bucket
#        scoop install 14f3v/kubetui
# winget (`winget:` publisher) is a later option: it also installs from the zip,
# but each release opens a PR against microsoft/winget-pkgs that Microsoft reviews.
# scoops:
#   - repository:
#       owner: 14f3v
#       name: scoop-bucket
#       token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
#     # Same reason as the formula: name the manifest after the binary, not the repo.
#     name: kubetui
#     homepage: "https://github.com/14f3v/kubectl-tui"
#     description: "A terminal UI for managing and monitoring Kubernetes clusters"
#     license: "Apache-2.0"
