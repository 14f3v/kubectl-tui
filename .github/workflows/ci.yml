name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs (a new push to the same PR cancels the old run); never
# cancel a main push, so every merge is still validated.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest's image has MinGW gcc on PATH, so cgo (and with it -race)
        # works there without extra setup.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Vet
        run: go vet ./...
      # Same timeout as `make race`: race-instrumented tests run slowest on the
      # Windows runner.
      - name: Test (race)
        run: go test -race -timeout 180s ./...
      - name: Build
        run: go build ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd hack)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      # A snapshot release runs the whole pipeline (every archive, checksums, the
      # Homebrew formula) into dist/ but publishes nothing, so it needs no tokens:
      # the tap token is only read at publish time. `build` alone would stop
      # before the archives and never exercise the Windows zip override.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # goreleaser would still succeed if the zip override stopped matching (the
      # Windows archives would just come out as tarballs), so check the outputs.
      # `unzip -l <zip> kubetui.exe` exits 11 unless that exact top-level entry
      # exists; no pipe, so no SIGPIPE under the runner's pipefail.
      - name: Check release archives
        run: |
          for arch in amd64 arm64; do
            zip=$(ls dist/kubetui_*_windows_${arch}.zip)
            unzip -l "$zip" kubetui.exe >/dev/null
          done
          ls dist/kubetui_*_linux_*.tar.gz dist/kubetui_*_darwin_*.tar.gz
          test -s dist/checksums.txt
          test -s dist/homebrew/Formula/kubetui.rb
